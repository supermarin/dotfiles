set  -g allow-passthrough   on # unfuck copying from nested tui apps
set  -g  base-index         1
set  -g  default-terminal   "tmux-256color"
set  -g  focus-events       on # for neovim focus tracking
set  -g  history-limit      250000
set  -g  mode-keys          vi
set  -g  mouse              on
set  -g  status-keys        vi
set  -ga terminal-overrides ",*:RGB" # for neovim :checkhealth
set  -s  escape-time        0
setw -g  aggressive-resize  on
setw -g  clock-mode-style   12

setw -g  window-status-current-style fg=black,bg=brightwhite,bold,reverse
setw -g  window-status-current-format ' #W '
setw -g  window-status-format ' #W '
set  -g  status-justify centre
set  -g  status-position top
set  -g  status-interval 5
set  -g  status-left "#[bg=black,fg=brightwhite] #S #[default][#(whoami)@#(hostname)]"
set  -g  status-left-length 60
set  -g  status-right-length 60
set  -g  status-right "#(jj-prompt -R #{pane_current_path})"
set  -ag status-right " #(tmux-mem-cpu-load --colors --averages-count 0)"
set  -ag status-right " | %a %b %d %H:%M"

# Calculate status bar color based on the hostname
run-shell "tmux set -g status-bg \"#$(hostname | sha1sum | cut -c1-6)\""

bind-key   -n M-H select-window -t:-1
bind-key   -n M-L select-window -t:+1
bind-key   -n M-h select-pane -L
bind-key   -n M-l select-pane -R
bind-key   -n M-k select-pane -U
bind-key   -n M-j select-pane -D
bind-key   -n M-f resize-pane -Z
bind-key   -n M-n new-window
bind-key   -n M-d split-pane -h -c "#{pane_current_path}"
bind-key   -n M-D split-pane -v -c "#{pane_current_path}"

# unfuck clipboard in popups. without this, we can only yank from the main
# session but not from the popup.
set -s set-clipboard on
# experimental: tmux popup. using from thin clients not running sway
bind-key -n M-0 if-shell -F '#{==:#{session_name},popup}' \
  'detach-client' \
  'display-popup -E -d "#{pane_current_path}" "tmux new-session -A -s popup"'

bind-key   -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
