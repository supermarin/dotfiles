setw -g  aggressive-resize  on
set  -g  allow-passthrough  on # unfuck copying from nested tui apps
set  -g  base-index         1
set  -g  default-terminal   "tmux-256color"
set  -g  focus-events       on # for neovim focus tracking
set  -g  history-limit      250000
set  -g  mode-keys          vi
set  -g  mouse              on
set  -g  status-keys        vi
set  -ga terminal-overrides ",*:RGB" # for neovim :checkhealth
set  -s  escape-time        0

set  -g  status-style fg=brightwhite,bg=black
setw -g  window-status-current-style fg=black,bg=brightwhite
setw -g  window-status-current-format ' #W '
setw -g  window-status-format ' #W'
set  -g  status-justify absolute-centre
set  -g  status-position top
set  -g  status-interval 5
set  -g  status-left  ""
set  -g  status-right ""
set  -g  status-left-length  600000
set  -g  status-right-length  600000
set  -ga status-left  " #S"
set  -ga status-left  " #(jj-prompt -R #{pane_current_path})"
set  -ag status-right "#(printf '#[fg=#%%s][%%s@%%s]#[default]' \"\$(hostname | sha1sum | cut -c1-6)\" \"\$(whoami)\" \"\$(hostname)\")"
set  -ga status-right " #(tmux-mem-cpu-load --colors --averages-count 0 --graph-lines 0 -p)#[default]"
set  -ga status-right " %a %b %d %H:%M "

bind -n M-H select-window -t:-1
bind -n M-L select-window -t:+1
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-f resize-pane -Z
bind -n M-n new-window
bind -n M-d split-pane -h -c "#{pane_current_path}"
bind -n M-D split-pane -v -c "#{pane_current_path}"

# unfuck clipboard in popups. without this, we can only yank from the main
# session but not from the popup.
set -s set-clipboard on
# experimental: tmux popup. using from thin clients not running sway
bind -n M-0 if-shell -F '#{==:#{session_name},popup}' \
  'detach-client' \
  'display-popup -E -d "#{pane_current_path}" "tmux new-session -A -s popup"'

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
